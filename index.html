<html>
<head>
<title>Session 23</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<style>
header{
    background-image: url(https://media.istockphoto.com/id/1381637603/photo/mountain-landscape.jpg?s=612x612&w=0&k=20&c=w64j3fW8C96CfYo3kbi386rs_sHH_6BGe8lAAAFS-y4=);
    text-align:center;
    padding:20px;
}
</style>
</head>
<body>
<header>
<h1 class="text-center">Student Record Manager</h1>
</header>

<div class="container mt-5">
<div class="row my-3">

<div class="col-md-6">
<div class="card p-3 shadow">
<h3>Add Student</h3>
<form id="studentform">
<div class="mb-3">
<label class="form-label">Student Name:</label>
<input type="text" id="name" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Student Age:</label>
<input type="number" id="age" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Student Type:</label>
<select id="type" class="form-select" required>
<option value="regular">Regular</option>
<option value="honours">Honours</option>
</select>
</div>

<button class="btn btn-primary">Add Student</button>

</form>
</div>
</div>

<div class="col-md-6">
<div class="card p-3 shadow">
<h3>Student List</h3>
<table class="table table-bordered">
<thead>
<tr>
<th>Student Name</th>
<th>Student Age</th>
<th>Student Type</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="studenttable"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>
let regularStudents = [];
let honoursStudents = [];

function displayStudent(){
    let table = document.getElementById("studenttable");
    table.innerHTML = "";

    // regular students
    for(let i = 0; i < regularStudents.length; i++){
    table.innerHTML += `
    <tr>
    <td>${regularStudents[i].name}</td>
    <td>${regularStudents[i].age}</td>
    <td>Regular</td>
    <td>
    <button class="btn btn-danger btn-sm" onlick="deleteStudent('regular', ${i})">Delete</button>
    </td>
    </tr>
    `;
    }

    // honours students
    for(let i = 0; i < honoursStudents.length; i++){
    table.innerHTML += `
    <tr>
    <td>${honoursStudents[i].name}</td>
    <td>${honoursStudents[i].age}</td>
    <td>Honours</td>
    <td>
    <button class="btn btn-danger btn-sm" onclick="deletingStudent('honours', ${i})">Delete</button>
    </td>
    </tr>
    `;
    }
}

<!-- form submission -->
document.getElementById("studentform").addEventListener("submit", function(e){
     e.preventDefault();

let name = document.getElementById("name").value;
let age = document.getElementById("age").value;
let type = document.getElementById("type").value;
     let student = {
        name: name, age: age,  
     };

if(type==="regular"){
regularStudents.push(student);
}
else{
    honoursStudents.push(student);
}

this.reset();
displayStudent()
})

<!-- deleting student -->
function deleteStudent(type, index){
    if(type==="regular"){
regularStudents.splice(index, 1);
    }
    else{
        honoursStudents.splice(index, 1);
    }
}

</script>
</body>
</html>
